<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0f1120;
      --card:     #141728;
      --sd:       #090b14;
      --sl:       #1e2238;
      --text:     #dde1f5;
      --sub:      #5e6591;
      --muted:    #3a4060;
      --accent:   #6c5ce7;
      --accent2:  #4a90e2;
      --glow:     rgba(108,92,231,.35);
      --soft:     rgba(108,92,231,.08);
      --border:   rgba(108,92,231,.12);
      --chip:     #1a1e35;
      --green:    #3dd68c;
    }
    [data-theme="light"] {
      --bg:       #f0f1f9;
      --card:     #eceef8;
      --sd:       #c8cade;
      --sl:       #ffffff;
      --text:     #111428;
      --sub:      #6068a0;
      --muted:    #b0b4cc;
      --accent:   #5548d9;
      --accent2:  #3a7ae0;
      --glow:     rgba(85,72,217,.25);
      --soft:     rgba(85,72,217,.07);
      --border:   rgba(85,72,217,.14);
      --chip:     #e5e7f4;
      --green:    #1a9e60;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      transition: background .35s, color .35s;
      overflow-x: hidden;
    }

    /* Subtle static gradient bg — no canvas, no lag */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 55% 45% at 85% 10%, rgba(108,92,231,.13) 0%, transparent 70%),
        radial-gradient(ellipse 40% 35% at 10% 90%, rgba(74,144,226,.1) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Theme toggle */
    .theme-btn {
      width: 42px; height: 42px;
      border-radius: 12px; border: none; cursor: pointer;
      background: var(--card); color: var(--sub);
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl);
      transition: color .25s, transform .25s, box-shadow .25s;
      margin-bottom: .85rem;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-btn:hover { color: var(--accent); transform: scale(1.08); }
    .theme-btn:active { box-shadow: 2px 2px 5px var(--sd), -2px -2px 5px var(--sl); transform: scale(.96); }

    /* Card */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background: var(--card);
      border-radius: 24px;
      padding: 2.25rem 1.85rem 2rem;
      box-shadow: 12px 12px 28px var(--sd), -12px -12px 28px var(--sl);
      animation: cardIn .55s cubic-bezier(.22,1,.36,1) both;
      border: 1px solid var(--border);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Avatar */
    .avatar-wrap {
      display: flex; justify-content: center;
      margin-bottom: 1.4rem;
      animation: fadeUp .5s .08s both;
    }
    .avatar-ring {
      position: relative;
      width: 96px; height: 96px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 22px var(--glow), 6px 6px 14px var(--sd), -6px -6px 14px var(--sl);
      cursor: pointer;
      transition: box-shadow .3s, transform .3s;
    }
    .avatar-ring:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 36px var(--glow), 6px 6px 14px var(--sd), -6px -6px 14px var(--sl);
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--chip);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      border: 3px solid var(--card);
    }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
    .status-dot {
      position: absolute; bottom: 4px; right: 4px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--green);
      border: 2.5px solid var(--card);
      box-shadow: 0 0 8px var(--green);
      animation: glow 2.4s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 6px var(--green); }
      50%      { box-shadow: 0 0 14px var(--green); }
    }

    /* Name */
    .name-block {
      text-align: center;
      margin-bottom: .75rem;
      animation: fadeUp .5s .12s both;
    }
    .name {
      font-family: 'Syne', sans-serif;
      font-size: 1.85rem; font-weight: 800;
      letter-spacing: -.5px;
      background: linear-gradient(115deg, var(--text) 30%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .handle { font-size: .82rem; color: var(--accent); font-weight: 500; margin-top: .1rem; letter-spacing: .3px; }

    /* Bio typing */
    .bio-wrap {
      text-align: center;
      min-height: 2.8rem;
      margin-bottom: 1.1rem;
      animation: fadeUp .5s .16s both;
    }
    .bio-text { font-size: .86rem; color: var(--sub); line-height: 1.75; font-weight: 300; }
    .bio-text strong { color: var(--text); font-weight: 500; }
    .cursor {
      display: inline-block; width: 1.5px; height: .85em;
      background: var(--accent); margin-left: 1px;
      vertical-align: middle; border-radius: 1px;
      animation: blink .8s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Tags */
    .tags {
      display: flex; flex-wrap: wrap; gap: .4rem;
      justify-content: center;
      margin-bottom: 1.15rem;
      animation: fadeUp .5s .2s both;
    }
    .tag {
      background: var(--chip); color: var(--sub);
      font-size: .71rem; font-weight: 500;
      padding: .28rem .7rem; border-radius: 6px;
      border: 1px solid transparent;
      box-shadow: 2px 2px 5px var(--sd), -2px -2px 5px var(--sl);
      transition: color .2s, border-color .2s, transform .2s;
      cursor: default; user-select: none;
    }
    .tag:hover { color: var(--accent); border-color: var(--border); transform: translateY(-1px); }
    .tag.hi { color: var(--accent); background: var(--soft); border-color: var(--border); }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--muted), transparent);
      margin: 1.1rem 0; opacity: .4;
    }

    /* Info row */
    .info-row {
      display: flex; flex-wrap: wrap; gap: .5rem;
      justify-content: center;
      margin-bottom: 1.2rem;
      animation: fadeUp .5s .24s both;
    }
    .pill {
      display: flex; align-items: center; gap: .35rem;
      background: var(--chip); color: var(--sub);
      border-radius: 8px; padding: .32rem .8rem;
      font-size: .75rem;
      box-shadow: 2px 2px 5px var(--sd), -2px -2px 5px var(--sl);
      transition: color .2s, transform .2s;
      border: 1px solid transparent;
      cursor: default;
    }
    .pill:hover { color: var(--text); transform: translateY(-1px); border-color: var(--border); }

    /* Vibe bars */
    .vibe-section {
      margin-bottom: 1.2rem;
      animation: fadeUp .5s .28s both;
    }
    .section-label {
      font-size: .67rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500;
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: .6rem;
    }
    .section-label::before, .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--muted); opacity: .3;
    }
    .vibe-bars { display: flex; flex-direction: column; gap: .45rem; }
    .vibe-row { display: flex; align-items: center; gap: .75rem; }
    .vibe-name { font-size: .75rem; color: var(--sub); width: 52px; flex-shrink: 0; font-weight: 300; }
    .vibe-track {
      flex: 1; height: 5px; border-radius: 99px;
      background: var(--chip);
      box-shadow: inset 1px 1px 3px var(--sd), inset -1px -1px 3px var(--sl);
      overflow: hidden;
    }
    .vibe-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 1.1s cubic-bezier(.25,1,.5,1);
    }
    .vibe-pct { font-size: .7rem; color: var(--sub); width: 26px; text-align: right; font-weight: 300; }

    /* Links */
    .links {
      display: flex; flex-direction: column; gap: .55rem;
      animation: fadeUp .5s .32s both;
    }
    .link-btn {
      display: flex; align-items: center; gap: .8rem;
      padding: .82rem 1rem;
      border-radius: 14px;
      text-decoration: none; color: var(--text);
      background: var(--card);
      box-shadow: 5px 5px 12px var(--sd), -5px -5px 12px var(--sl);
      font-size: .85rem; font-weight: 400;
      border: 1px solid transparent;
      position: relative; overflow: hidden;
      transition: border-color .22s, color .22s, transform .22s, box-shadow .22s;
    }
    .link-btn:hover {
      border-color: var(--border);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 7px 7px 16px var(--sd), -7px -7px 16px var(--sl);
    }
    .link-btn:active { transform: scale(.98); }

    /* ripple */
    .rip {
      position: absolute; border-radius: 50%;
      background: var(--accent); opacity: .1;
      transform: scale(0);
      animation: ripp .55s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripp { to { transform: scale(5); opacity: 0; } }

    .link-icon {
      width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: .95rem; flex-shrink: 0;
      box-shadow: 2px 2px 6px var(--sd), -2px -2px 6px var(--sl);
      transition: transform .25s;
    }
    .link-btn:hover .link-icon { transform: scale(1.1); }
    .link-label { flex: 1; line-height: 1; }
    .link-sub { display: block; font-size: .69rem; color: var(--sub); margin-top: .18rem; transition: color .22s; font-weight: 300; }
    .link-btn:hover .link-sub { color: var(--accent); opacity: .65; }
    .link-arrow { color: var(--muted); font-size: .8rem; transition: transform .22s, color .22s; }
    .link-btn:hover .link-arrow { transform: translateX(3px); color: var(--accent); }

    .ic-fb   { background: rgba(24,119,242,.1); color: #4b93f7; }
    .ic-ig   { background: rgba(225,48,108,.1); color: #e1306c; }
    .ic-mail { background: var(--soft); color: var(--accent); }
    .ic-tt   { background: rgba(255,255,255,.05); color: var(--text); }

    /* Footer */
    .footer {
      text-align: center; margin-top: 1.6rem;
      font-size: .68rem; color: var(--muted);
      animation: fadeUp .5s .38s both;
      user-select: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Tooltip */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 7px); left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--chip); color: var(--text);
      font-size: .68rem; padding: .28rem .6rem; border-radius: 7px;
      white-space: nowrap; pointer-events: none; opacity: 0;
      box-shadow: 3px 3px 10px var(--sd); border: 1px solid var(--border);
      transition: opacity .18s, transform .18s;
      z-index: 50;
    }
    [data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<script>
const lines = [
  "Hey, I'm <strong>Ger</strong> from the Philippines 🇵🇭",
  "Grade 12 student who codes for fun.",
  "Aspiring <strong>game developer</strong>.",
  "Into music, arts & gaming.",
  "Always down to make new <strong>friends</strong> ✌️",
];
let li = 0, ci = 0, del = false, hold = 0;
const bioEl = document.getElementById('bioText');

function typeLoop() {
  if (hold-- > 0) { setTimeout(typeLoop, 40); return; }
  const src = lines[li];
  const plain = src.replace(/<[^>]+>/g, '');
  if (!del) {
    ci = Math.min(ci + 1, plain.length);
    if (ci === plain.length) { del = true; hold = 50; }
  } else {
    ci = Math.max(ci - 1, 0);
    if (ci === 0) { del = false; li = (li + 1) % lines.length; hold = 10; }
  }
  let out = '', count = 0, inTag = false;
  for (let i = 0; i < src.length && count < ci; i++) {
    if (src[i] === '<') { inTag = true; }
    if (inTag) { out += src[i]; if (src[i] === '>') inTag = false; continue; }
    out += src[i]; count++;
  }
  if (out.includes('<strong>') && !out.includes('</strong>')) out += '</strong>';
  bioEl.innerHTML = out + '<span class="cursor"></span>';
  setTimeout(typeLoop, del ? 26 : 48);
}
setTimeout(typeLoop, 700);

window.addEventListener('load', () => {
  setTimeout(() => {
    document.querySelectorAll('.vibe-fill').forEach(b => b.style.width = b.dataset.pct + '%');
  }, 300);
});

function ripple(e) {
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const s = Math.max(rect.width, rect.height);
  const el = document.createElement('span');
  el.className = 'rip';
  el.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX-rect.left-s/2}px;top:${e.clientY-rect.top-s/2}px`;
  btn.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

const faces = ['🧑‍💻','😎','👾','🎮','🎵','🎨','⚡','🫡'];
let fi = 0;
function cycleAvatar() {
  const el = document.getElementById('avatarEl');
  if (el.querySelector('img')) return;
  fi = (fi + 1) % faces.length;
  el.textContent = faces[fi];
}

function toggleTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('themeBtn').textContent = dark ? '🌙' : '☀️';
}
</script>
