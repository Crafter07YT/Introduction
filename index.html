<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #1A1612;
      --card:     #211D19;
      --sd:       #120F0C;
      --sl:       #2C2722;
      --text:     #EDE8E0;
      --sub:      #8A7D6F;
      --muted:    #4A4138;
      --accent:   #C4783A;
      --accent2:  #E09A60;
      --glow:     rgba(196,120,58,.22);
      --soft:     rgba(196,120,58,.10);
      --border:   rgba(196,120,58,.14);
      --chip:     #2A2420;
      --green:    #6BAA7A;
    }
    [data-theme="light"] {
      --bg:       #F7F3EC;
      --card:     #FDFAF5;
      --sd:       #DDD5C8;
      --sl:       #FFFFFF;
      --text:     #1C1712;
      --sub:      #7A6A58;
      --muted:    #C0B4A4;
      --accent:   #B5621F;
      --accent2:  #D4884A;
      --glow:     rgba(181,98,31,.18);
      --soft:     rgba(181,98,31,.08);
      --border:   rgba(181,98,31,.16);
      --chip:     #EDE7DD;
      --green:    #4A8F5A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      transition: background .4s ease, color .4s ease;
      overflow-x: hidden;
    }

    /* Warm grain texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: .028;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 5%, rgba(196,120,58,.09) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 15% 95%, rgba(196,120,58,.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Theme toggle */
    .theme-btn {
      position: relative; z-index: 2;
      width: 40px; height: 40px;
      border-radius: 10px; border: 1px solid var(--border); cursor: pointer;
      background: var(--card); color: var(--sub);
      font-size: .9rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 10px var(--sd), -2px -2px 8px var(--sl);
      transition: color .25s, transform .2s, border-color .25s;
      margin-bottom: .9rem;
    }
    .theme-btn:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.06); }
    .theme-btn:active { transform: scale(.95); }

    /* Card */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 370px;
      background: var(--card);
      border-radius: 20px;
      padding: 2.2rem 1.8rem 1.9rem;
      box-shadow: 10px 10px 30px var(--sd), -6px -6px 20px var(--sl);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
      border: 1px solid var(--border);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Avatar */
    .avatar-wrap {
      display: flex; justify-content: center;
      margin-bottom: 1.35rem;
      animation: fadeUp .5s .08s both;
    }
    .avatar-ring {
      position: relative;
      width: 88px; height: 88px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(145deg, var(--accent), var(--accent2));
      box-shadow: 0 0 20px var(--glow), 6px 6px 14px var(--sd);
      cursor: pointer;
      transition: box-shadow .35s, transform .3s;
    }
    .avatar-ring:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px var(--glow), 6px 6px 16px var(--sd);
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--chip);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      border: 3px solid var(--card);
    }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
    .status-dot {
      position: absolute; bottom: 3px; right: 3px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--green);
      border: 2.5px solid var(--card);
      animation: pulse 2.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 5px var(--green); }
      50%      { box-shadow: 0 0 12px var(--green); }
    }

    /* Name */
    .name-block {
      text-align: center;
      margin-bottom: .8rem;
      animation: fadeUp .5s .12s both;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 500;
      letter-spacing: .5px;
      color: var(--text);
      line-height: 1;
    }
    .name-line {
      display: block;
      width: 32px; height: 1.5px;
      background: var(--accent);
      margin: .55rem auto 0;
      border-radius: 2px;
      opacity: .75;
    }

    /* Bio */
    .bio-wrap {
      text-align: center;
      min-height: 2.6rem;
      margin-bottom: 1.15rem;
      animation: fadeUp .5s .16s both;
    }
    .bio-text {
      font-size: .84rem;
      color: var(--sub);
      line-height: 1.8;
      font-weight: 300;
    }
    .bio-text strong { color: var(--text); font-weight: 500; }
    .cursor {
      display: inline-block; width: 1.5px; height: .8em;
      background: var(--accent); margin-left: 1.5px;
      vertical-align: middle; border-radius: 2px;
      animation: blink .85s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Tags */
    .tags {
      display: flex; flex-wrap: wrap; gap: .38rem;
      justify-content: center;
      margin-bottom: 1.2rem;
      animation: fadeUp .5s .2s both;
    }
    .tag {
      background: transparent;
      color: var(--sub);
      font-size: .68rem;
      font-weight: 400;
      padding: .24rem .65rem;
      border-radius: 5px;
      border: 1px solid var(--muted);
      transition: color .2s, border-color .2s, transform .2s;
      cursor: default;
      user-select: none;
      letter-spacing: .3px;
    }
    .tag:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .tag.hi { color: var(--accent); border-color: var(--border); background: var(--soft); }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 40%, var(--border) 60%, transparent);
      margin: 1.1rem 0;
    }

    /* Info row */
    .info-row {
      display: flex; flex-wrap: wrap; gap: .4rem;
      justify-content: center;
      margin-bottom: 1.3rem;
      animation: fadeUp .5s .24s both;
    }
    .pill {
      display: flex; align-items: center; gap: .3rem;
      background: var(--chip);
      color: var(--sub);
      border-radius: 6px;
      padding: .28rem .72rem;
      font-size: .72rem;
      border: 1px solid var(--border);
      letter-spacing: .2px;
    }

    /* Interest bars */
    .interest-section {
      margin-bottom: 1.2rem;
      animation: fadeUp .5s .28s both;
    }
    .section-label {
      font-size: .62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: .65rem;
    }
    .section-label::before, .section-label::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--muted));
      opacity: .35;
    }
    .section-label::before { background: linear-gradient(270deg, transparent, var(--muted)); }

    .bars { display: flex; flex-direction: column; gap: .5rem; }
    .bar-row { display: flex; align-items: center; gap: .75rem; }
    .bar-name { font-size: .73rem; color: var(--sub); width: 50px; flex-shrink: 0; font-weight: 300; }
    .bar-track {
      flex: 1; height: 4px; border-radius: 99px;
      background: var(--chip);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 1.2s cubic-bezier(.22,1,.36,1);
    }
    .bar-pct { font-size: .68rem; color: var(--muted); width: 26px; text-align: right; font-weight: 300; }

    /* Social links */
    .links {
      display: flex; flex-direction: column; gap: .5rem;
      animation: fadeUp .5s .32s both;
    }
    .link-btn {
      display: flex; align-items: center; gap: .75rem;
      padding: .78rem .95rem;
      border-radius: 12px;
      text-decoration: none; color: var(--text);
      background: var(--chip);
      font-size: .83rem; font-weight: 400;
      border: 1px solid transparent;
      position: relative; overflow: hidden;
      transition: border-color .22s, color .22s, transform .2s, background .22s;
    }
    .link-btn:hover {
      border-color: var(--border);
      background: var(--card);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .link-btn:active { transform: scale(.98); }

    /* Ripple */
    .rip {
      position: absolute; border-radius: 50%;
      background: var(--accent); opacity: .08;
      transform: scale(0);
      animation: ripp .55s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripp { to { transform: scale(6); opacity: 0; } }

    .link-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform .22s;
    }
    .link-btn:hover .link-icon { transform: scale(1.08); }
    .link-label { flex: 1; line-height: 1; }
    .link-sub { display: block; font-size: .67rem; color: var(--sub); margin-top: .15rem; transition: color .22s; }
    .link-btn:hover .link-sub { color: var(--accent); opacity: .7; }
    .link-arrow { color: var(--muted); font-size: .78rem; transition: transform .22s, color .22s; }
    .link-btn:hover .link-arrow { transform: translateX(3px); color: var(--accent); }

    .ic-fb   { background: rgba(24,119,242,.09); color: #5B9CF6; }
    .ic-ig   { background: rgba(225,48,108,.09); color: #E1306C; }
    .ic-mail { background: var(--soft); color: var(--accent); }
    .ic-tt   { background: rgba(255,255,255,.06); color: var(--text); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .64rem;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: fadeUp .5s .4s both;
      user-select: none;
      font-family: 'DM Sans', sans-serif;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Tooltip */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--chip); color: var(--text);
      font-size: .65rem; padding: .25rem .55rem; border-radius: 6px;
      white-space: nowrap; pointer-events: none; opacity: 0;
      box-shadow: 3px 3px 10px var(--sd); border: 1px solid var(--border);
      transition: opacity .18s, transform .18s;
      z-index: 50;
      font-family: 'DM Sans', sans-serif;
    }
    [data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

<script>
  // Theme
  const root = document.documentElement;
  const btn  = document.getElementById('themeBtn');
  const icon = document.getElementById('themeIcon');

  const sunSVG = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  const moonSVG = `<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>`;

  function updateIcon() {
    icon.innerHTML = root.dataset.theme === 'dark' ? sunSVG : moonSVG;
  }
  updateIcon();

  function toggleTheme() {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    updateIcon();
    localStorage.setItem('theme', root.dataset.theme);
  }

  const saved = localStorage.getItem('theme');
  if (saved) { root.dataset.theme = saved; updateIcon(); }

  // Typing bio
  const lines = [
    "Hey, I'm <strong>Ger</strong> from the Philippines 🇵🇭",
    "Grade 12 student who codes for fun.",
    "Aspiring <strong>game developer</strong>.",
    "Into music, arts &amp; gaming.",
    "Always down to make new <strong>friends</strong> ✌️",
  ];
  let li = 0, ci = 0, del = false, hold = 0;
  const bioEl = document.getElementById('bioText');

  function typeLoop() {
    if (hold-- > 0) { setTimeout(typeLoop, 40); return; }
    const src = lines[li];
    const plain = src.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&');
    if (!del) {
      ci = Math.min(ci + 1, plain.length);
      if (ci === plain.length) { del = true; hold = 52; }
    } else {
      ci = Math.max(ci - 1, 0);
      if (ci === 0) { del = false; li = (li + 1) % lines.length; hold = 10; }
    }
    let out = '', count = 0, inTag = false;
    for (let i = 0; i < src.length && count < ci; i++) {
      if (src[i] === '<') inTag = true;
      if (inTag) { out += src[i]; if (src[i] === '>') inTag = false; continue; }
      if (src[i] === '&') {
        const semi = src.indexOf(';', i);
        if (semi !== -1) { out += src.slice(i, semi + 1); i = semi; count++; continue; }
      }
      out += src[i]; count++;
    }
    if (out.includes('<strong>') && !out.includes('</strong>')) out += '</strong>';
    bioEl.innerHTML = out + '<span class="cursor"></span>';
    setTimeout(typeLoop, del ? 24 : 46);
  }
  setTimeout(typeLoop, 700);

  // Interest bars
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach(b => b.style.width = b.dataset.pct + '%');
    }, 350);
  });

  // Ripple
  function ripple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const s = Math.max(rect.width, rect.height);
    const el = document.createElement('span');
    el.className = 'rip';
    el.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - rect.left - s / 2}px;top:${e.clientY - rect.top - s / 2}px`;
    btn.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  // Avatar cycle
  const emojis = ['🧑‍💻','😎','👾','🎮','🎵','🎨','⚡','🫡'];
  let ei = 0;
  function cycleAvatar() {
    const el = document.getElementById('avatarEl');
    if (el.querySelector('img')) {
      el.innerHTML = emojis[ei];
    } else {
      ei = (ei + 1) % emojis.length;
      el.textContent = emojis[ei];
    }
  }
</script>
</body>
</html>
